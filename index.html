<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DWG55 CAD</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101820;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
}
header{
 height:65px;
 background:#202e3a;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:8px;
 gap:8px;
}
header b{font-size:17px}
button{
 border:0;
 border-radius:9px;
 padding:12px;
 background:#334b60;
 color:white;
 font-size:14px;
 cursor:pointer;
 white-space:nowrap;
}
button.active{background:#087fe2}
.toolbar{
 display:flex;
 gap:7px;
 padding:8px;
 height:65px;
 background:#1b2935;
 overflow-x:auto;
}
.toolbar button{flex-shrink:0}
#canvas{
 display:block;
 width:100%;
 height:calc(100dvh - 175px);
 touch-action:none;
 background:#101820;
}
footer{
 height:45px;
 background:#202e3a;
 padding:12px;
 font-size:12px;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
}
#fileInput{
 position:absolute;
 width:1px;
 height:1px;
 opacity:0;
 pointer-events:none;
}
</style>
</head>

<body>

<header>
 <b>DWG55 CAD</b>

 <button type="button" id="openBtn">
 📂 فتح ملف
 </button>

 <button type="button" id="fitBtn">
 ⤢ ضبط
 </button>
</header>

<input type="file"
 id="fileInput"
 accept=".dwg,.dxf,application/octet-stream,*/*">

<div class="toolbar">
 <button class="active" data-tool="pan">✋ تحريك</button>
 <button data-tool="line">╱ خط</button>
 <button data-tool="distance">↔ مسافة</button>
 <button data-tool="area">▱ مساحة</button>
 <button id="finishBtn">✓ إنهاء</button>
 <button id="zoomIn">＋</button>
 <button id="zoomOut">－</button>
 <button id="undoBtn">↶ تراجع</button>
 <button id="clearBtn">مسح</button>
</div>

<canvas id="canvas"></canvas>

<footer id="status">
اضغط فتح ملف لاختيار خريطة DXF أو DWG
</footer>

<script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const statusBox=document.getElementById('status');
const input=document.getElementById('fileInput');

let objects=[];
let pending=[];
let tool='pan';
let scale=30;
let ox=0,oy=0;
let drag=null;
let pointers=new Map();
let pinch=null;
let ignoreTap=false;

function msg(t){
 statusBox.textContent=t;
}

function resize(){
 let d=window.devicePixelRatio||1;
 canvas.width=Math.round(canvas.clientWidth*d);
 canvas.height=Math.round(canvas.clientHeight*d);
 ctx.setTransform(d,0,0,d,0,0);
 draw();
}

function screenPoint(p){
 return{
  x:p.x*scale+ox,
  y:-p.y*scale+oy
 };
}

function worldPoint(p){
 return{
  x:(p.x-ox)/scale,
  y:-(p.y-oy)/scale
 };
}

function localPoint(e){
 const r=canvas.getBoundingClientRect();
 return{
  x:e.clientX-r.left,
  y:e.clientY-r.top
 };
}

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function polygonArea(points){
 let sum=0;
 for(let i=0;i<points.length;i++){
  let a=points[i];
  let b=points[(i+1)%points.length];
  sum+=a.x*b.y-b.x*a.y;
 }
 return Math.abs(sum/2);
}

function draw(){
 const w=canvas.clientWidth;
 const h=canvas.clientHeight;

 ctx.fillStyle='#101820';
 ctx.fillRect(0,0,w,h);

 if(scale>8){
  ctx.beginPath();
  ctx.strokeStyle='#243746';
  ctx.lineWidth=.7;

  for(let x=((ox%scale)+scale)%scale;x<w;x+=scale){
   ctx.moveTo(x,0);
   ctx.lineTo(x,h);
  }

  for(let y=((oy%scale)+scale)%scale;y<h;y+=scale){
   ctx.moveTo(0,y);
   ctx.lineTo(w,y);
  }
  ctx.stroke();
 }

 for(const o of objects){
  ctx.beginPath();

  if(o.center&&o.radius){
   let p=screenPoint(o.center);
   ctx.arc(p.x,p.y,o.radius*scale,0,Math.PI*2);
  }else{
   (o.p||[]).forEach((p,i)=>{
    let s=screenPoint(p);
    if(i===0)ctx.moveTo(s.x,s.y);
    else ctx.lineTo(s.x,s.y);
   });
  }

  if(o.closed)ctx.closePath();

  ctx.strokeStyle=o.color||'#55d8ff';
  ctx.lineWidth=1.5;
  ctx.stroke();

  if(o.label&&o.p&&o.p.length){
   let s=screenPoint(o.p[o.p.length-1]);
   ctx.fillStyle='#ffd76b';
   ctx.font='13px Arial';
   ctx.fillText(o.label,s.x+6,s.y-6);
  }
 }

 if(pending.length){
  ctx.beginPath();

  pending.forEach((p,i)=>{
   let s=screenPoint(p);
   if(i===0)ctx.moveTo(s.x,s.y);
   else ctx.lineTo(s.x,s.y);
  });

  ctx.strokeStyle='#ffce64';
  ctx.lineWidth=2;
  ctx.stroke();
 }
}

function fitDrawing(){
 let all=[];

 for(const o of objects){
  if(o.p)all.push(...o.p);

  if(o.center&&o.radius){
   all.push(
    {x:o.center.x-o.radius,y:o.center.y-o.radius},
    {x:o.center.x+o.radius,y:o.center.y+o.radius}
   );
  }
 }

 if(!all.length){
  scale=30;
  ox=canvas.clientWidth/2;
  oy=canvas.clientHeight/2;
  draw();
  return;
 }

 let minX=Infinity,minY=Infinity;
 let maxX=-Infinity,maxY=-Infinity;

 for(const p of all){
  minX=Math.min(minX,p.x);
  maxX=Math.max(maxX,p.x);
  minY=Math.min(minY,p.y);
  maxY=Math.max(maxY,p.y);
 }

 let width=Math.max(maxX-minX,.01);
 let height=Math.max(maxY-minY,.01);

 scale=Math.min(
  canvas.clientWidth*.88/width,
  canvas.clientHeight*.88/height,
  100000
 );

 ox=canvas.clientWidth/2-(minX+maxX)*scale/2;
 oy=canvas.clientHeight/2+(minY+maxY)*scale/2;

 draw();
}

function zoom(f,x=canvas.clientWidth/2,y=canvas.clientHeight/2){
 let p=worldPoint({x,y});
 scale=Math.max(.00001,Math.min(100000,scale*f));
 ox=x-p.x*scale;
 oy=y+p.y*scale;
 draw();
}

function tap(p){
 if(tool==='pan')return;

 pending.push(worldPoint(p));

 if(pending.length===2&&
 (tool==='line'||tool==='distance')){

  let d=distance(pending[0],pending[1]);

  objects.push({
   p:[...pending],
   color:tool==='distance'?'#ffd76b':'#55d8ff',
   label:tool==='distance'?d.toFixed(2):''
  });

  pending=[];

  msg(tool==='distance'?
   'المسافة: '+d.toFixed(2)+' وحدة رسم':
   'تم رسم الخط');
 }

 draw();
}

function finish(){
 if(tool==='area'&&pending.length>=3){
  let a=polygonArea(pending);

  objects.push({
   p:[...pending],
   closed:true,
   color:'#67e8a5',
   label:a.toFixed(2)
  });

  msg('المساحة: '+a.toFixed(2)+' وحدة مربعة');
 }

 pending=[];
 draw();
}

canvas.addEventListener('pointerdown',e=>{
 canvas.setPointerCapture(e.pointerId);
 let p=localPoint(e);

 pointers.set(e.pointerId,p);

 if(pointers.size===1){
  drag={start:p,last:p,moved:false};
  ignoreTap=false;
 }

 if(pointers.size===2){
  let a=[...pointers.values()];
  pinch={
   d:distance(a[0],a[1]),
   x:(a[0].x+a[1].x)/2,
   y:(a[0].y+a[1].y)/2
  };
  ignoreTap=true;
 }
});

canvas.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;

 let p=localPoint(e);
 pointers.set(e.pointerId,p);

 if(pointers.size===2){
  let a=[...pointers.values()];
  let v={
   d:distance(a[0],a[1]),
   x:(a[0].x+a[1].x)/2,
   y:(a[0].y+a[1].y)/2
  };

  if(pinch&&pinch.d){
   ox+=v.x-pinch.x;
   oy+=v.y-pinch.y;
   zoom(v.d/pinch.d,v.x,v.y);
  }

  pinch=v;
  ignoreTap=true;

 }else if(tool==='pan'&&drag){
  ox+=p.x-drag.last.x;
  oy+=p.y-drag.last.y;

  if(distance(p,drag.start)>5){
   drag.moved=true;
  }

  drag.last=p;
  draw();
 }
});

canvas.addEventListener('pointerup',e=>{
 let p=localPoint(e);

 if(pointers.size===1&&drag&&
 !drag.moved&&!ignoreTap){
  tap(p);
 }

 pointers.delete(e.pointerId);

 if(!pointers.size){
  drag=null;
  pinch=null;
  ignoreTap=false;
 }
});

canvas.addEventListener('pointercancel',e=>{
 pointers.delete(e.pointerId);
 drag=null;
 pinch=null;
 ignoreTap=false;
});

document.querySelectorAll('[data-tool]').forEach(btn=>{
 btn.onclick=()=>{
  tool=btn.dataset.tool;
  pending=[];

  document.querySelectorAll('[data-tool]').forEach(b=>{
   b.classList.toggle('active',b===btn);
  });

  msg('الأداة: '+btn.textContent);
  draw();
 };
});

document.getElementById('finishBtn').onclick=finish;
document.getElementById('fitBtn').onclick=fitDrawing;
document.getElementById('zoomIn').onclick=()=>zoom(1.3);
document.getElementById('zoomOut').onclick=()=>zoom(1/1.3);

document.getElementById('undoBtn').onclick=()=>{
 if(pending.length)pending.pop();
 else objects.pop();
 draw();
};

document.getElementById('clearBtn').onclick=()=>{
 if(confirm('مسح الرسم الحالي؟')){
  objects=[];
  pending=[];
  fitDrawing();
  msg('تم مسح الرسم');
 }
};

// فتح نافذة ملفات أندرويد
document.getElementById('openBtn').addEventListener('click',()=>{
 msg('جاري فتح مدير الملفات...');
 input.click();
});

function convertEntities(entities){
 const result=[];

 for(const e of entities){
  if(e.type==='LINE'&&e.vertices?.length>=2){
   result.push({
    p:e.vertices.slice(0,2).map(v=>({
     x:v.x,y:v.y
    }))
   });
  }

  if((e.type==='LWPOLYLINE'||e.type==='POLYLINE')
   &&e.vertices?.length>1){
   result.push({
    p:e.vertices.map(v=>({x:v.x,y:v.y})),
    closed:!!(e.shape||e.closed)
   });
  }

  if(e.type==='CIRCLE'&&e.center&&e.radius){
   result.push({
    center:{x:e.center.x,y:e.center.y},
    radius:e.radius
   });
  }
 }

 return result;
}

input.addEventListener('change',async()=>{
 const file=input.files&&input.files[0];
 input.value='';

 if(!file){
  msg('لم يتم اختيار ملف');
  return;
 }

 msg('تم اختيار: '+file.name);

 const ext=file.name.split('.').pop().toLowerCase();

 if(ext==='dwg'){
  msg('تم اختيار DWG: '+file.name+
  ' — يحتاج محرك DWG حقيقي لعرض الخريطة');
  return;
 }

 if(ext!=='dxf'){
  msg('صيغة غير مدعومة: '+ext);
  return;
 }

 try{
  msg('جاري تحميل خريطة DXF...');

  if(typeof DxfParser==='undefined'){
   throw Error('مكتبة DXF غير متاحة، افحص الإنترنت');
  }

  const content=await file.text();
  const parser=new DxfParser();
  const drawing=parser.parseSync(content);

  objects=convertEntities(drawing.entities||[]);
  pending=[];

  if(!objects.length){
   msg('الملف انقرأ، لكن ماكو عناصر مدعومة');
   return;
  }

  fitDrawing();

  msg('تم فتح '+file.name+
  ' | عدد العناصر: '+objects.length);

 }catch(err){
  msg('خطأ بفتح DXF: '+err.message);
 }
});

window.addEventListener('resize',resize);
resize();
fitDrawing();
</script>
</body>
</html>
