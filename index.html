
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DWG55 CAD Viewer</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101820;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 min-height:65px;
 background:#202d39;
 display:flex;
 align-items:center;
 justify-content:space-around;
 gap:6px;
 padding:6px;
}
button,label{
 background:#304458;
 color:white;
 border:0;
 border-radius:8px;
 padding:12px;
 cursor:pointer;
 font-size:14px;
 text-align:center;
}
button.active{background:#087ee8}
.toolbar{
 display:flex;
 gap:6px;
 padding:8px;
 overflow-x:auto;
 background:#1c2934;
}
.toolbar button{flex-shrink:0}
#canvas{
 display:block;
 width:100%;
 height:calc(100dvh - 165px);
 touch-action:none;
 background:#101820;
}
footer{
 min-height:45px;
 padding:12px;
 background:#202d39;
 text-align:center;
 font-size:13px;
}
</style>
</head>
<body>

<header>
<strong>DWG55 CAD</strong>

<label>
 فتح DWG / DXF
 <input
  type="file"
  accept=".dwg,.dxf,application/octet-stream"
  hidden
  onchange="loadFile(event)">
</label>

<button onclick="resetView()">إعادة ضبط</button>
</header>

<div class="toolbar">
<button class="active" onclick="setTool('pan',this)">تحريك</button>
<button onclick="setTool('line',this)">خط</button>
<button onclick="setTool('distance',this)">مسافة</button>
<button onclick="setTool('area',this)">مساحة</button>
<button onclick="zoom(1.3)">＋</button>
<button onclick="zoom(0.77)">－</button>
<button onclick="undo()">تراجع</button>
<button onclick="clearDrawing()">مسح</button>
</div>

<canvas id="canvas"></canvas>

<footer id="status">
جاهز للرسم | وحدة الرسم: متر
</footer>

<script>
const c=document.getElementById('canvas');
const ctx=c.getContext('2d');
const status=document.getElementById('status');

let objects=[];
let points=[];
let tool='pan';
let scale=35;
let ox=0,oy=0;
let dragging=false;
let last=null;
let selectedFile=null;

function resize(){
 const ratio=window.devicePixelRatio||1;
 c.width=c.clientWidth*ratio;
 c.height=c.clientHeight*ratio;
 ctx.setTransform(ratio,0,0,ratio,0,0);
 draw();
}

function pos(e){
 const r=c.getBoundingClientRect();
 return {
  x:(e.clientX-r.left-ox)/scale,
  y:(e.clientY-r.top-oy)/scale
 };
}

function screen(p){
 return {
  x:p.x*scale+ox,
  y:p.y*scale+oy
 };
}

function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function area(p){
 let a=0;
 for(let i=0;i<p.length;i++){
  let j=(i+1)%p.length;
  a+=p[i].x*p[j].y-p[j].x*p[i].y;
 }
 return Math.abs(a/2);
}

function draw(){
 const w=c.clientWidth;
 const h=c.clientHeight;
 ctx.clearRect(0,0,w,h);

 ctx.strokeStyle='#243746';
 ctx.lineWidth=.7;

 const step=scale;
 if(step>8){
  for(let x=((ox%step)+step)%step;x<w;x+=step){
   ctx.beginPath();
   ctx.moveTo(x,0);
   ctx.lineTo(x,h);
   ctx.stroke();
  }
  for(let y=((oy%step)+step)%step;y<h;y+=step){
   ctx.beginPath();
   ctx.moveTo(0,y);
   ctx.lineTo(w,y);
   ctx.stroke();
  }
 }

 for(const o of objects){
  ctx.beginPath();
  o.p.forEach((p,i)=>{
   const s=screen(p);
   if(i===0)ctx.moveTo(s.x,s.y);
   else ctx.lineTo(s.x,s.y);
  });
  if(o.closed)ctx.closePath();
  ctx.strokeStyle=o.color||'#4bd5ff';
  ctx.lineWidth=2;
  ctx.stroke();

  if(o.label){
   const s=screen(o.p[o.p.length-1]);
   ctx.fillStyle='#f7d35d';
   ctx.font='14px Arial';
   ctx.fillText(o.label,s.x+8,s.y-8);
  }
 }

 if(points.length){
  ctx.beginPath();
  points.forEach((p,i)=>{
   const s=screen(p);
   if(!i)ctx.moveTo(s.x,s.y);
   else ctx.lineTo(s.x,s.y);
  });
  ctx.strokeStyle='#ffca55';
  ctx.lineWidth=2;
  ctx.stroke();
 }
}

function setTool(t,b){
 tool=t;
 points=[];
 document.querySelectorAll('.toolbar button')
  .forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 status.textContent='الأداة: '+t;
 draw();
}

c.addEventListener('pointerdown',e=>{
 c.setPointerCapture(e.pointerId);
 last={x:e.clientX,y:e.clientY};
 dragging=tool==='pan';

 if(!dragging){
  points.push(pos(e));

  if(points.length===2&&tool!=='area'){
   const d=dist(points[0],points[1]);
   objects.push({
    p:[...points],
    label:tool==='distance'?d.toFixed(2)+' m':'',
    color:tool==='distance'?'#ffd45a':'#4bd5ff'
   });
   status.textContent=tool==='distance'
    ?'المسافة: '+d.toFixed(2)+' متر'
    :'تم رسم الخط';
   points=[];
   draw();
  }
 }
});

c.addEventListener('pointermove',e=>{
 if(dragging&&last){
  ox+=e.clientX-last.x;
  oy+=e.clientY-last.y;
  last={x:e.clientX,y:e.clientY};
  draw();
 }
});

c.addEventListener('pointerup',()=>dragging=false);
c.addEventListener('pointercancel',()=>dragging=false);

c.addEventListener('dblclick',()=>{
 if(tool==='area'&&points.length>=3){
  const a=area(points);
  objects.push({
   p:[...points],
   closed:true,
   label:a.toFixed(2)+' m²',
   color:'#67e8a5'
  });
  status.textContent='المساحة: '+a.toFixed(2)+' متر مربع';
  points=[];
  draw();
 }
});

function zoom(f){
 scale=Math.max(2,Math.min(2000,scale*f));
 draw();
}

function undo(){
 if(points.length)points.pop();
 else objects.pop();
 draw();
}

function resetView(){
 ox=0;
 oy=0;
 scale=35;
 draw();
}

function clearDrawing(){
 objects=[];
 points=[];
 selectedFile=null;
 resetView();
 status.textContent='تم مسح الرسم';
}

async function loadFile(e){
 const file=e.target.files[0];
 if(!file)return;

 const ext=file.name.split('.').pop().toLowerCase();

 if(ext!=='dwg'&&ext!=='dxf'){
  status.textContent='صيغة الملف غير مدعومة';
  e.target.value='';
  return;
 }

 try{
  status.textContent='جاري قراءة الملف...';

  const data=await file.arrayBuffer();
  selectedFile={
   name:file.name,
   type:ext,
   buffer:data
  };

  const size=(data.byteLength/1024).toFixed(1);

  status.textContent=
   'تم اختيار '+file.name+
   ' ('+size+' KB) — عرض الرسم يحتاج محرك CAD';

 }catch(error){
  status.textContent='تعذر قراءة الملف: '+error.message;
 }
 e.target.value='';
}

window.addEventListener('resize',resize);
resize();
</script>
</body>
</html>
