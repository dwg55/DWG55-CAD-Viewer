<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DWG55 CAD</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101820;color:#fff;
 font-family:Arial,sans-serif;overflow:hidden
}
header{
 height:66px;background:#202e3b;
 display:flex;align-items:center;
 justify-content:space-between;
 gap:8px;padding:8px
}
button,.openbox{
 background:#334b60;color:white;
 border:0;border-radius:9px;
 padding:12px;font-size:14px;
 white-space:nowrap
}
.openbox{
 position:relative;
 overflow:hidden;
 background:#087ee2;
 cursor:pointer;
 flex:1;text-align:center;
 max-width:230px
}
.openbox input{
 position:absolute;inset:0;
 width:100%;height:100%;
 opacity:0;cursor:pointer;
 font-size:100px
}
.toolbar{
 display:flex;gap:7px;
 background:#1b2935;
 padding:8px;overflow-x:auto;
 height:62px
}
.toolbar button{flex-shrink:0}
.active{background:#087ee2}
canvas{
 display:block;width:100%;
 height:calc(100dvh - 180px);
 touch-action:none;background:#101820
}
footer{
 height:52px;background:#202e3b;
 padding:8px;font-size:12px;
 overflow:auto
}
#details{color:#83d6ff}
</style>
</head>
<body>

<header>
 <b>DWG55 CAD</b>
 <div class="openbox">
 📂 فتح ملف
 <input type="file" id="file"
 aria-label="اختيار ملف من الهاتف">
 </div>
 <button onclick="fit()">⤢ ضبط</button>
</header>

<div class="toolbar">
 <button class="active" data-tool="pan">✋ تحريك</button>
 <button data-tool="line">╱ خط</button>
 <button data-tool="distance">↔ قياس</button>
 <button data-tool="area">▱ مساحة</button>
 <button onclick="finish()">✓ إنهاء</button>
 <button onclick="zoom(1.3)">＋</button>
 <button onclick="zoom(1/1.3)">－</button>
 <button onclick="undo()">↶ تراجع</button>
 <button onclick="clearAll()">مسح</button>
</div>

<canvas id="canvas"></canvas>

<footer>
 <div id="status">جاهز — اضغط فتح ملف</div>
 <div id="details">DWG55 CAD v6</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>
<script>
const c=document.getElementById('canvas');
const ctx=c.getContext('2d');
const fileInput=document.getElementById('file');
const statusEl=document.getElementById('status');
const details=document.getElementById('details');

let objects=[],pending=[],tool='pan';
let scale=30,ox=0,oy=0;
let last=null,moved=false;
const touches=new Map();
let pinch=null;

function msg(s){statusEl.textContent=s}

function resize(){
 const d=devicePixelRatio||1;
 c.width=Math.round(c.clientWidth*d);
 c.height=Math.round(c.clientHeight*d);
 ctx.setTransform(d,0,0,d,0,0);
 draw();
}

function screen(p){
 return{x:p.x*scale+ox,y:oy-p.y*scale};
}
function world(p){
 return{x:(p.x-ox)/scale,y:(oy-p.y)/scale};
}
function local(e){
 const r=c.getBoundingClientRect();
 return{x:e.clientX-r.left,y:e.clientY-r.top};
}
function dist(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}
function area(a){
 let n=0;
 for(let i=0;i<a.length;i++){
  let p=a[i],q=a[(i+1)%a.length];
  n+=p.x*q.y-q.x*p.y;
 }
 return Math.abs(n/2);
}

function draw(){
 const w=c.clientWidth,h=c.clientHeight;
 ctx.fillStyle='#101820';
 ctx.fillRect(0,0,w,h);

 if(scale>8){
  ctx.beginPath();
  ctx.strokeStyle='#243746';
  ctx.lineWidth=.6;
  for(let x=((ox%scale)+scale)%scale;x<w;x+=scale){
   ctx.moveTo(x,0);ctx.lineTo(x,h);
  }
  for(let y=((oy%scale)+scale)%scale;y<h;y+=scale){
   ctx.moveTo(0,y);ctx.lineTo(w,y);
  }
  ctx.stroke();
 }

 for(const o of objects){
  ctx.beginPath();
  if(o.center&&o.radius){
   const p=screen(o.center);
   ctx.arc(p.x,p.y,o.radius*scale,0,Math.PI*2);
  }else{
   (o.p||[]).forEach((v,i)=>{
    const p=screen(v);
    if(i)ctx.lineTo(p.x,p.y);
    else ctx.moveTo(p.x,p.y);
   });
  }
  if(o.closed)ctx.closePath();
  ctx.strokeStyle=o.color||'#54d8ff';
  ctx.lineWidth=1.5;
  ctx.stroke();
  if(o.label&&o.p?.length){
   const p=screen(o.p[o.p.length-1]);
   ctx.fillStyle='#ffd36b';
   ctx.font='13px Arial';
   ctx.fillText(o.label,p.x+5,p.y-5);
  }
 }

 if(pending.length){
  ctx.beginPath();
  pending.forEach((v,i)=>{
   const p=screen(v);
   if(i)ctx.lineTo(p.x,p.y);
   else ctx.moveTo(p.x,p.y);
  });
  ctx.strokeStyle='#ffca55';
  ctx.lineWidth=2;
  ctx.stroke();
 }
}

function fit(){
 const all=[];
 for(const o of objects){
  if(o.p)all.push(...o.p);
  if(o.center&&o.radius){
   all.push(
    {x:o.center.x-o.radius,y:o.center.y-o.radius},
    {x:o.center.x+o.radius,y:o.center.y+o.radius}
   );
  }
 }
 if(!all.length){
  scale=30;ox=c.clientWidth/2;oy=c.clientHeight/2;
  draw();return;
 }
 let minX=Infinity,maxX=-Infinity;
 let minY=Infinity,maxY=-Infinity;
 for(const p of all){
  minX=Math.min(minX,p.x);
  maxX=Math.max(maxX,p.x);
  minY=Math.min(minY,p.y);
  maxY=Math.max(maxY,p.y);
 }
 scale=Math.min(
  c.clientWidth*.88/Math.max(maxX-minX,.01),
  c.clientHeight*.88/Math.max(maxY-minY,.01),
  100000
 );
 ox=c.clientWidth/2-(minX+maxX)*scale/2;
 oy=c.clientHeight/2+(minY+maxY)*scale/2;
 draw();
}

function zoom(f,x=c.clientWidth/2,y=c.clientHeight/2){
 const p=world({x,y});
 scale=Math.max(.00001,Math.min(100000,scale*f));
 ox=x-p.x*scale;
 oy=y+p.y*scale;
 draw();
}

function tap(p){
 if(tool==='pan')return;
 pending.push(world(p));
 if(pending.length===2&&
 (tool==='line'||tool==='distance')){
  const d=dist(pending[0],pending[1]);
  objects.push({
   p:[...pending],
   color:tool==='distance'?'#ffd36b':'#54d8ff',
   label:tool==='distance'?d.toFixed(2):''
  });
  pending=[];
  msg(tool==='distance'?
   'المسافة: '+d.toFixed(2)+' وحدة رسم':
   'تم رسم خط');
 }
 draw();
}

function finish(){
 if(tool==='area'&&pending.length>=3){
  const a=area(pending);
  objects.push({
   p:[...pending],closed:true,
   color:'#67e8a5',label:a.toFixed(2)
  });
  msg('المساحة: '+a.toFixed(2)+' وحدة مربعة');
 }
 pending=[];draw();
}

function undo(){
 if(pending.length)pending.pop();
 else objects.pop();
 draw();
}
function clearAll(){
 if(confirm('مسح الرسم؟')){
  objects=[];pending=[];fit();
  msg('تم مسح الرسم');
 }
}

document.querySelectorAll('[data-tool]').forEach(b=>{
 b.onclick=()=>{
  tool=b.dataset.tool;
  pending=[];
  document.querySelectorAll('[data-tool]').forEach(x=>{
   x.classList.toggle('active',x===b);
  });
  msg('الأداة: '+b.textContent);
  draw();
 };
});

c.addEventListener('pointerdown',e=>{
 c.setPointerCapture(e.pointerId);
 const p=local(e);
 touches.set(e.pointerId,p);
 if(touches.size===1){
  last=p;moved=false;
 }
 if(touches.size===2){
  const a=[...touches.values()];
  pinch={
   d:dist(a[0],a[1]),
   x:(a[0].x+a[1].x)/2,
   y:(a[0].y+a[1].y)/2
  };
  moved=true;
 }
});

c.addEventListener('pointermove',e=>{
 if(!touches.has(e.pointerId))return;
 const p=local(e);
 const old=touches.get(e.pointerId);
 touches.set(e.pointerId,p);

 if(touches.size===2){
  const a=[...touches.values()];
  const v={
   d:dist(a[0],a[1]),
   x:(a[0].x+a[1].x)/2,
   y:(a[0].y+a[1].y)/2
  };
  if(pinch&&pinch.d){
   ox+=v.x-pinch.x;
   oy+=v.y-pinch.y;
   zoom(v.d/pinch.d,v.x,v.y);
  }
  pinch=v;moved=true;
 }else if(last){
  if(dist(p,last)>3)moved=true;
  if(tool==='pan'){
   ox+=p.x-old.x;
   oy+=p.y-old.y;
   draw();
  }
 }
});

c.addEventListener('pointerup',e=>{
 const p=local(e);
 if(touches.size===1&&!moved)tap(p);
 touches.delete(e.pointerId);
 if(!touches.size){
  last=null;pinch=null;
 }else moved=true;
});

c.addEventListener('pointercancel',e=>{
 touches.delete(e.pointerId);
 last=null;pinch=null;
});

function parseEntities(entities){
 const out=[];
 for(const e of entities){
  if(e.type==='LINE'&&e.vertices?.length>=2){
   out.push({
    p:e.vertices.slice(0,2).map(v=>({x:v.x,y:v.y}))
   });
  }else if(
   (e.type==='POLYLINE'||e.type==='LWPOLYLINE')&&
   e.vertices?.length>1
  ){
   out.push({
    p:e.vertices.map(v=>({x:v.x,y:v.y})),
    closed:!!(e.shape||e.closed)
   });
  }else if(e.type==='CIRCLE'&&e.center&&e.radius){
   out.push({
    center:{x:e.center.x,y:e.center.y},
    radius:e.radius
   });
  }
 }
 return out;
}

fileInput.addEventListener('change',async e=>{
 const f=e.target.files?.[0];
 if(!f)return;
 msg('تم اختيار: '+f.name);
 details.textContent=
  'الحجم: '+(f.size/1048576).toFixed(2)+' MB';

 const ext=f.name.split('.').pop().toLowerCase();

 if(ext==='dwg'){
  try{
   const header=await f.slice(0,6).text();
   details.textContent+=' | DWG Header: '+header;
   msg('تم اختيار DWG بنجاح، لكن العرض يحتاج محرك DWG');
  }catch(err){
   msg('تعذر قراءة الملف: '+err.message);
  }
 }else if(ext==='dxf'){
  try{
   if(typeof DxfParser==='undefined'){
    throw Error('مكتبة DXF غير محملة');
   }
   msg('جاري تحليل DXF...');
   const parser=new DxfParser();
   const doc=parser.parseSync(await f.text());
   objects=parseEntities(doc.entities||[]);
   pending=[];
   if(objects.length){
    fit();
    msg('تم عرض '+objects.length+' عنصر من '+f.name);
   }else{
    msg('تمت القراءة لكن لا توجد عناصر مدعومة');
   }
  }catch(err){
   msg('خطأ DXF: '+err.message);
  }
 }else{
  msg('الملف المختار ليس DWG أو DXF');
 }
 fileInput.value='';
});

fileInput.addEventListener('cancel',()=>{
 msg('تم إغلاق اختيار الملفات');
});

window.addEventListener('resize',resize);
resize();fit();
</script>
</body>
</html>
