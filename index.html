<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>DWG55 CAD</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font:14px Arial}
header,.tools,footer{
 background:#202e3a;
 padding:9px;
 display:flex;
 align-items:center;
 gap:7px
}
header{justify-content:space-between;height:60px}
.tools{overflow-x:auto;height:56px}
button,label{
 background:#334a5e;
 color:white;
 border:0;
 border-radius:8px;
 padding:11px;
 white-space:nowrap;
 cursor:pointer
}
button.active{background:#0786d4}
canvas{
 display:block;
 width:100%;
 height:calc(100dvh - 160px);
 touch-action:none
}
footer{height:44px;font-size:12px}
#status{
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap
}
dialog{
 background:#22323e;
 color:white;
 border:1px solid #5b7184;
 border-radius:12px;
 max-width:90vw
}
input[type=url]{
 width:100%;
 padding:12px;
 background:#101820;
 color:white;
 border:1px solid #60758a
}
small{display:block;margin:12px 0;line-height:1.6}
</style>
</head>
<body>

<header>
 <b>DWG55 CAD</b>
 <label>
 📂 فتح DWG / DXF
 <input id="file" type="file" accept=".dwg,.dxf" hidden>
 </label>
 <button id="settings">⚙️</button>
</header>

<nav class="tools">
 <button data-tool="pan" class="active">✋ تحريك</button>
 <button data-tool="line">╱ خط</button>
 <button data-tool="distance">↔ قياس</button>
 <button data-tool="area">▱ مساحة</button>
 <button id="finish">✓ إنهاء</button>
 <button id="undo">↶ تراجع</button>
 <button id="fit">⤢ ملاءمة</button>
 <button id="plus">＋</button>
 <button id="minus">－</button>
 <button id="export">↓ JSON</button>
</nav>

<canvas id="canvas"></canvas>

<footer>
 <span id="status">جاهز. DXF يعمل؛ DWG يحتاج سيرفر CAD.</span>
</footer>

<dialog id="dialog">
 <h3>خادم تحويل DWG</h3>
 <p>أدخل رابط HTTPS لخدمة تحول DWG إلى JSON.</p>
 <input id="endpoint" type="url"
 placeholder="https://your-server.example/convert">
 <small>
 صيغة الرد:
 {"objects":[{"p":[{"x":0,"y":0},{"x":10,"y":10}]}]}
 </small>
 <button id="saveEndpoint">حفظ</button>
 <button id="cancel">إغلاق</button>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/dxf-parser@1.1.2/dist/dxf-parser.js"></script>

<script>
const c=document.getElementById('canvas');
const ctx=c.getContext('2d');
const st=document.getElementById('status');

let objects=[];
let pending=[];
let tool='pan';
let scale=30;
let ox=0,oy=0;
let drag=null;
const fingers=new Map();
let pinch=null;

const msg=t=>st.textContent=t;

function resize(){
 let d=devicePixelRatio||1;
 c.width=c.clientWidth*d;
 c.height=c.clientHeight*d;
 ctx.setTransform(d,0,0,d,0,0);
 draw();
}

function sc(p){
 return{x:p.x*scale+ox,y:-p.y*scale+oy};
}

function world(p){
 return{x:(p.x-ox)/scale,y:-(p.y-oy)/scale};
}

function xy(e){
 let r=c.getBoundingClientRect();
 return{x:e.clientX-r.left,y:e.clientY-r.top};
}

function length(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function area(a){
 return Math.abs(a.reduce((s,p,i)=>{
  let q=a[(i+1)%a.length];
  return s+p.x*q.y-q.x*p.y;
 },0)/2);
}

function draw(){
 let w=c.clientWidth,h=c.clientHeight;
 ctx.fillStyle='#101820';
 ctx.fillRect(0,0,w,h);

 if(scale>8){
  ctx.strokeStyle='#243747';
  ctx.lineWidth=.6;
  ctx.beginPath();

  for(let x=((ox%scale)+scale)%scale;x<w;x+=scale){
   ctx.moveTo(x,0);
   ctx.lineTo(x,h);
  }

  for(let y=((oy%scale)+scale)%scale;y<h;y+=scale){
   ctx.moveTo(0,y);
   ctx.lineTo(w,y);
  }
  ctx.stroke();
 }

 for(let o of objects){
  ctx.beginPath();

  if(o.center&&o.radius){
   let p=sc(o.center);
   ctx.arc(p.x,p.y,o.radius*scale,0,Math.PI*2);
  }else{
   (o.p||[]).forEach((p,i)=>{
    p=sc(p);
    if(i)ctx.lineTo(p.x,p.y);
    else ctx.moveTo(p.x,p.y);
   });
  }

  if(o.closed)ctx.closePath();

  ctx.strokeStyle=o.color||'#54d8ff';
  ctx.lineWidth=1.5;
  ctx.stroke();

  if(o.label&&o.p?.length){
   let p=sc(o.p[o.p.length-1]);
   ctx.fillStyle='#ffd36b';
   ctx.font='13px Arial';
   ctx.fillText(o.label,p.x+6,p.y-6);
  }
 }

 if(pending.length){
  ctx.beginPath();
  pending.forEach((p,i)=>{
   p=sc(p);
   if(i)ctx.lineTo(p.x,p.y);
   else ctx.moveTo(p.x,p.y);
  });
  ctx.strokeStyle='#ffc65e';
  ctx.lineWidth=2;
  ctx.stroke();
 }
}

function fit(){
 let a=objects.flatMap(o=>o.p||[]);

 for(let o of objects){
  if(o.center&&o.radius){
   a.push(
    {x:o.center.x-o.radius,y:o.center.y-o.radius},
    {x:o.center.x+o.radius,y:o.center.y+o.radius}
   );
  }
 }

 if(!a.length){
  scale=30;
  ox=c.clientWidth/2;
  oy=c.clientHeight/2;
  draw();
  return;
 }

 let xs=a.map(p=>p.x);
 let ys=a.map(p=>p.y);
 let l=Math.min(...xs),r=Math.max(...xs);
 let b=Math.min(...ys),t=Math.max(...ys);

 scale=Math.min(
  c.clientWidth*.88/Math.max(r-l,.01),
  c.clientHeight*.88/Math.max(t-b,.01),
  10000
 );

 ox=c.clientWidth/2-(l+r)*scale/2;
 oy=c.clientHeight/2+(b+t)*scale/2;
 draw();
}

function zoom(f,x=c.clientWidth/2,y=c.clientHeight/2){
 let p=world({x,y});
 scale=Math.max(.00001,Math.min(100000,scale*f));
 ox=x-p.x*scale;
 oy=y+p.y*scale;
 draw();
}

function finish(){
 if(tool==='area'&&pending.length>=3){
  let v=area(pending);
  objects.push({
   p:[...pending],
   closed:true,
   color:'#62e7a4',
   label:v.toFixed(2)+' units²'
  });
  msg('المساحة: '+v.toFixed(2)+' وحدة²');
 }
 pending=[];
 draw();
}

function tap(p){
 let v=world(p);
 if(tool==='pan')return;

 pending.push(v);

 if(pending.length===2&&
 (tool==='line'||tool==='distance')){
  let d=length(...pending);

  objects.push({
   p:[...pending],
   color:tool==='distance'?'#ffce6d':'#54d8ff',
   label:tool==='distance'?d.toFixed(2)+' units':''
  });

  pending=[];
  msg(tool==='distance'?
   'المسافة: '+d.toFixed(2)+' وحدة':'تم رسم خط');
 }
 draw();
}

c.addEventListener('pointerdown',e=>{
 c.setPointerCapture(e.pointerId);
 let p=xy(e);
 fingers.set(e.pointerId,p);
 drag={p,moved:false};

 if(fingers.size===2){
  let a=[...fingers.values()];
  pinch={
   d:length(...a),
   x:(a[0].x+a[1].x)/2,
   y:(a[0].y+a[1].y)/2
  };
 }
});

c.addEventListener('pointermove',e=>{
 if(!fingers.has(e.pointerId))return;

 let p=xy(e);
 let old=fingers.get(e.pointerId);
 fingers.set(e.pointerId,p);

 if(fingers.size===2){
  let a=[...fingers.values()];
  let v={
   d:length(...a),
   x:(a[0].x+a[1].x)/2,
   y:(a[0].y+a[1].y)/2
  };

  if(pinch&&pinch.d){
   ox+=v.x-pinch.x;
   oy+=v.y-pinch.y;
   zoom(v.d/pinch.d,v.x,v.y);
  }
  pinch=v;
  if(drag)drag.moved=true;
 }else if(tool==='pan'&&drag){
  ox+=p.x-old.x;
  oy+=p.y-old.y;
  if(length(p,drag.p)>4)drag.moved=true;
  draw();
 }
});

c.addEventListener('pointerup',e=>{
 let p=xy(e);
 if(fingers.size===1&&drag&&!drag.moved)tap(p);
 fingers.delete(e.pointerId);

 if(!fingers.size){
  drag=null;
  pinch=null;
 }else if(drag){
  drag.moved=true;
 }
});

c.addEventListener('pointercancel',e=>{
 fingers.delete(e.pointerId);
 drag=null;
 pinch=null;
});

c.addEventListener('dblclick',finish);

c.addEventListener('wheel',e=>{
 e.preventDefault();
 let p=xy(e);
 zoom(e.deltaY<0?1.2:1/1.2,p.x,p.y);
},{passive:false});

document.querySelectorAll('[data-tool]').forEach(b=>{
 b.onclick=()=>{
  pending=[];
  tool=b.dataset.tool;

  document.querySelectorAll('[data-tool]').forEach(x=>{
   x.classList.toggle('active',x===b);
  });

  msg('الأداة: '+b.textContent);
  draw();
 };
});

document.getElementById('finish').onclick=finish;

document.getElementById('undo').onclick=()=>{
 if(pending.length)pending.pop();
 else objects.pop();
 draw();
};

document.getElementById('fit').onclick=fit;
document.getElementById('plus').onclick=()=>zoom(1.3);
document.getElementById('minus').onclick=()=>zoom(1/1.3);

document.getElementById('export').onclick=()=>{
 let a=document.createElement('a');
 let u=URL.createObjectURL(
  new Blob([JSON.stringify({objects},null,2)],
  {type:'application/json'})
 );
 a.href=u;
 a.download='dwg55-drawing.json';
 a.click();
 setTimeout(()=>URL.revokeObjectURL(u),1000);
};

const dlg=document.getElementById('dialog');
const endpoint=document.getElementById('endpoint');

endpoint.value=localStorage.getItem('dwg55-endpoint')||'';

document.getElementById('settings').onclick=()=>{
 dlg.showModal();
};

document.getElementById('cancel').onclick=()=>{
 dlg.close();
};

document.getElementById('saveEndpoint').onclick=()=>{
 if(endpoint.value&&!endpoint.value.startsWith('https://')){
  alert('استخدم HTTPS');
  return;
 }
 localStorage.setItem('dwg55-endpoint',endpoint.value.trim());
 dlg.close();
};

function loadEntities(entities){
 let out=[];

 for(let e of entities){
  let layer=e.layer||'0';
  let color='#54d8ff';

  if(e.type==='LINE'&&e.vertices?.length>=2){
   out.push({
    p:e.vertices.slice(0,2).map(p=>({x:p.x,y:p.y})),
    layer,color
   });
  }else if(
   ['LWPOLYLINE','POLYLINE'].includes(e.type)&&
   e.vertices?.length>1
  ){
   out.push({
    p:e.vertices.map(p=>({x:p.x,y:p.y})),
    closed:!!(e.shape||e.closed),
    layer,color
   });
  }else if(e.type==='CIRCLE'&&e.center&&e.radius){
   out.push({
    center:{x:e.center.x,y:e.center.y},
    radius:e.radius,
    layer,color
   });
  }
 }
 return out;
}

document.getElementById('file').onchange=async e=>{
 let file=e.target.files[0];
 e.target.value='';
 if(!file)return;

 try{
  msg('جاري قراءة '+file.name);
  let ext=file.name.split('.').pop().toLowerCase();

  if(ext==='dxf'){
   if(typeof DxfParser==='undefined'){
    throw Error('تعذر تحميل مكتبة DXF؛ تحقق من الإنترنت');
   }

   let parser=new DxfParser();
   let doc=parser.parseSync(await file.text());
   objects=loadEntities(doc.entities||[]);

  }else if(ext==='dwg'){
   let url=localStorage.getItem('dwg55-endpoint');

   if(!url){
    throw Error('DWG يحتاج خادم تحويل؛ اضغط ⚙️');
   }

   let fd=new FormData();
   fd.append('file',file);

   let response=await fetch(url,{
    method:'POST',
    body:fd
   });

   if(!response.ok){
    throw Error('السيرفر رد بخطأ '+response.status);
   }

   let data=await response.json();

   if(!Array.isArray(data.objects)){
    throw Error('رد السيرفر غير صالح');
   }

   objects=data.objects;

  }else{
   throw Error('الملف يجب أن يكون DWG أو DXF');
  }

  pending=[];

  if(objects.length){
   fit();
   msg('تم فتح '+file.name+' | '+objects.length+' عنصر');
  }else{
   msg('الملف لا يحتوي عناصر مدعومة للعرض');
  }

 }catch(err){
  msg('لم تفتح الخريطة: '+err.message);
 }
};

window.addEventListener('resize',resize);
resize();
fit();
</script>
</body>
</html>
